# See https://wiki.hyprland.org/Configuring/Window-Rules/ for more
# See https://wiki.hyprland.org/Configuring/Workspace-Rules/ for workspace rules

# --- Opacity ---
windowrule = opacity 0.9 override 0.85 override, match:class ^(foot)$
windowrule = opacity 0.95 override 0.9 override, match:class ^(neovide)$
windowrule = opacity 0.95 override 0.9 override, match:class ^(thunar)$

# --- Floating windows ---
windowrule = float on, match:class ^(galculator)$
windowrule = float on, match:class ^(pavucontrol)$
windowrule = float on, match:class ^(blueman-manager)$
windowrule = float on, match:class ^(nm-connection-editor)$
windowrule = float on, match:class ^(org\.kde\.polkit-kde-authentication-agent-1)$
windowrule = float on, match:class ^(org\.kde\.kdeconnect\.daemon)$
windowrule = float on, match:title ^(Picture-in-Picture)$
windowrule = float on, match:title ^(File Upload)$
windowrule = float on, match:title ^(Open File)$
windowrule = float on, match:title ^(Save As)$

# --- PiP: keep on top and sticky ---
windowrule = pin on, match:title ^(Picture-in-Picture)$
windowrule = size 480 270, match:title ^(Picture-in-Picture)$
windowrule = move 100%-490 100%-280, match:title ^(Picture-in-Picture)$

# --- Screen capture protection ---
windowrule = no_blur on, match:class ^(org\.kde\.polkit-kde-authentication-agent-1)$

# --- IDE / dev tools ---
windowrule = tile on, match:class ^(neovide)$
windowrule = tile on, match:class ^(jetbrains-.*)$

# --- Floating window sizes ---
windowrule = size 800 600, match:class ^(pavucontrol)$
windowrule = size 800 600, match:class ^(blueman-manager)$
windowrule = center on, match:class ^(pavucontrol)$
windowrule = center on, match:class ^(blueman-manager)$

# --- Wofi / wlogout ---
windowrule = stay_focused on, match:class ^(wofi)$
windowrule = animation slide, match:class ^(wlogout)$
